[project]
name = "grabbit-desktop"
version = "1.0.0"
description = "Grabbit for Mac and Windows: runs the Grabbit server in the menu bar / system tray and sets up the browser extension."
requires-python = ">=3.12"
dependencies = [
    # Keep these three pinned to the same versions as ../grabbit-web/pyproject.toml
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "yt-dlp[default,curl-cffi,deno]==2026.10.26",
    # Menu bar / system tray icon
    "pystray>=0.19.5",
    "pillow>=11",
]

[dependency-groups]
dev = ["pyinstaller>=6.16", "pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../grabbit-web"]
