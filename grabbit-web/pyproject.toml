[project]
name = "grabbit-web"
version = "1.0.0"
description = "A web app for downloading video and audio from YouTube and 1,800+ other sites, powered by yt-dlp."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    # deno = JavaScript runtime yt-dlp needs for full YouTube support
    "yt-dlp[default,curl-cffi,deno]==2026.10.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
markers = ["network: hits real sites (run with GRABBIT_NETWORK_TESTS=1)"]
